<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120">
  <defs>
    <style>
      .contabo-blue { fill: #0099FF; }
      .contabo-gold { fill: #FFA500; }
      .contabo-text { font-family: Arial, Helvetica, sans-serif; font-size: 72px; font-weight: 700; fill: #0099FF; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Contabo Mark: Interlinked C shapes -->
  <g>
    <!-- Gold C (back) -->
    <path class="contabo-gold" d="M 35 30 Q 15 30 15 60 Q 15 90 35 90 Q 45 90 50 85 L 45 75 Q 40 78 35 78 Q 22 78 22 60 Q 22 42 35 42 Q 40 42 45 45 L 50 35 Q 45 30 35 30 Z"/>

    <!-- Blue C (front) -->
    <path class="contabo-blue" d="M 55 25 Q 30 25 30 60 Q 30 95 55 95 Q 70 95 78 87 L 70 75 Q 63 80 55 80 Q 38 80 38 60 Q 38 40 55 40 Q 63 40 70 45 L 78 33 Q 70 25 55 25 Z"/>
  </g>

  <!-- CONTABO Text -->
  <text x="125" y="85" class="contabo-text">CONTABO</text>
</svg>