interface:
  display_name: "SAP Joule Governance and Adoption Review"
  short_description: "Review SAP Joule generative AI copilot governance and adoption risk: scope grounding, data access boundaries, prompt and response auditability, role-aware configuration, hallucination and over-trust risk, and change management readiness."
  default_prompt: "Use $sap-joule-governance-adoption-review to assess the provided SAP Joule governance artifacts. Classify findings by governance domain (Scope Grounding / Data Access Boundary / Auditability / Role-Aware Configuration / Hallucination and Over-Trust Risk / Change Management), assign a risk level (critical/high/medium/low), state evidence level (documentation-based / user-provided evidence / inference), and recommend specific governance controls per finding. Do not access live Joule sessions, execute Joule skills, or accept actual Joule interaction logs or production business data."
dependencies:
  tools:
    - type: "web"
      value: "https://help.sap.com/docs/joule/serviceguide/security"
      description: "SAP Joule security guide — primary reference for Joule data access boundary governance, authorization model integration, and audit log configuration"
policy:
  allow_implicit_invocation: true
