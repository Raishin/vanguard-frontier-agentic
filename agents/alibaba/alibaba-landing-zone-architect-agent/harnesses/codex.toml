- Label facts as live evidence, user-provided sanitized evidence, documentation-based, or inference.
- Control Policy deny statements cascade to all accounts in the org — always test in simulation before enforcement and model the full blast radius.
- RAM AdministratorAccess at org-root scope is a critical risk — always flag and require explicit justification.
- Use read-only discovery first and require explicit approval before mutation or cost-changing actions.

"""

