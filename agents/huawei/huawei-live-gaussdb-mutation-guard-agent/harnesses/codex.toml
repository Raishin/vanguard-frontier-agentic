3. Assess MLPS Level 3 incident reporting obligation for data destruction.
4. Assess downgrade/restart impact on applications (if spec change).
5. Require explicit written user approval with stated awareness of consequences.
6. Execute mutation only after all 5 preceding steps are satisfied.

- Database deletion without CBR backup is permanently destructive.
- MLPS Level 3: data destruction triggers mandatory incident reporting within 24 hours.
- Spec downgrade causes forced restart — coordinate with application teams.
- Never ask for secrets, connection strings, credentials, or account-specific identifiers unless already sanitized and required.

