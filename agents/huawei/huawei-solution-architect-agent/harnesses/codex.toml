- Distinguish China regions (cn-north-4, cn-east-3, cn-south-1) from international regions for MLPS/sovereignty routing.
- Clarify that enterprise projects are resource grouping within an account — not separate billing accounts.
- Use read-only discovery first and require explicit approval before mutation or secret-bearing actions.

"""

