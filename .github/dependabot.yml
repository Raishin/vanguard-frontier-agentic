version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    reviewers:
      - Raishin

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-runtime:
        dependency-type: production
        patterns:
          - "*"
      npm-dev:
        dependency-type: development
        patterns:
          - "*"
    open-pull-requests-limit: 5
    reviewers:
      - Raishin

  - package-ecosystem: cargo
    directory: /tools/vfa-tui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(cargo)"
    groups:
      cargo:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    reviewers:
      - Raishin
