# Builds the Jekyll documentation site and deploys it to GitHub Pages.
# Uses the official GitHub Pages deployment workflow with OIDC-based token
# exchange -- no long-lived credentials are stored in this repository.

name: Deploy Documentation to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "_config.yml"
      - "Gemfile"
      - "index.md"
      - "*.md"
  workflow_dispatch:

# Top-level least-privilege baseline. Only the deploy job elevates to the
# minimum scopes required for Pages publishing.
permissions:
  contents: read

# Allow exactly one Pages deployment at a time. We do NOT cancel in-progress
# runs because a half-deployed site can leave Pages in an inconsistent state.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # Bind the job to the github-pages environment so branch protection rules
    # and environment secrets (if any) apply. The url output surfaces the live
    # site link in the Actions UI.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Elevated permissions for this job only:
    # - pages: write  -> push the built artifact to GitHub Pages
    # - id-token: write -> mint an OIDC token for the Pages deployment API
    permissions:
      pages: write
      id-token: write

    steps:
      # 1. Checkout repository contents
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # 2. Enable GitHub Pages and retrieve configuration metadata
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      # 3. Install Ruby and cache bundled gems for faster builds
      - name: Setup Ruby
        uses: ruby/setup-ruby@a4effe49ee010ee34105294c221dc0ff8e1e5ea5 # v1.221.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # 4. Build the Jekyll site with production settings
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/vanguard-frontier-agentic"
        env:
          JEKYLL_ENV: production

      # 5. Upload the built site as a Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./_site

      # 6. Deploy the artifact to GitHub Pages via OIDC
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac553fd0d28 # v4.0.5
