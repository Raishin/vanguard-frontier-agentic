name: Fix Asset Integrity

on:
  workflow_dispatch:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - package.json
      - package-lock.json

permissions:
  contents: read

jobs:
  fix:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.actor == 'dependabot[bot]' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'dependabot/')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"

      - name: Regenerate asset integrity
        run: python3 tests/validate-asset-integrity.py --write

      - name: Commit and push if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git diff --quiet catalog/asset-integrity.json || (
            git add catalog/asset-integrity.json &&
            git commit -m "chore: regenerate asset integrity [skip ci]" &&
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          )
          echo "Done"
