name: Fix Asset Integrity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.x"

      - name: Regenerate asset integrity
        run: python3 tests/validate-asset-integrity.py --write

      - name: Commit and push if changed
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git diff --quiet catalog/asset-integrity.json || (
            git add catalog/asset-integrity.json &&
            git commit -m "chore: regenerate asset integrity [skip ci]" &&
            git push
          )
          echo "Done"
