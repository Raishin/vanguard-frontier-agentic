name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

# Top-level least-privilege baseline (Scorecard Token-Permissions). Write
# scope (security-events) is granted only on the `analyze` job.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # security-events:write — required by github/codeql-action/analyze to
      # upload SARIF results to the code-scanning dashboard.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Excludes only the intentionally-vulnerable detection test corpus
          # (tests/fixtures/frontend-security-detection). See the config file
          # for rationale; all shipped code remains in scope.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: /language:${{ matrix.language }}
